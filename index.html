<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iglesia Ascender - Estacionamiento</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui, -apple-system}body{margin:0;background:#f1f5f9;padding:12px;color:#0f172a}
.header{background:#fff;padding:16px;border-radius:16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);border:1px solid #e2e8f0}
.logo{width:60px;height:60px;background:#0f172a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#fff}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;margin:6px 0;cursor:pointer;font-size:14px;transition:.2s}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}
.btn-red{background:#dc2626;color:#fff}.btn-red:hover{background:#b91c1c}
.btn-blue{background:#2563eb;color:#fff}.btn-blue:hover{background:#1d4ed8}
.btn-dark{background:#0f172a;color:#fff}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:5px 0;outline:none}input:focus{border-color:#0f172a}
.badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800}.in{background:#dcfce7;color:#166534}.out{background:#fee2e2;color:#991b1b}
.list{border-bottom:1px solid #f1f5f9;padding:12px 0;display:flex;justify-content:space-between;align-items:center}
#qrBox{background:#fff;padding:20px;border-radius:16px;text-align:center;margin-top:12px;border:2px dashed #16a34a;display:none}
.live{background:#dcfce7;color:#166534;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
</style>
</head>
<body>
<div class="header"><div class="logo">AS</div><div><b style="font-size:16px">ASCENDER IGLESIA</b><br><small style="color:#64748b">PASE ESTACIONAMIENTO • CC INNOVACION • <span id="estado" class="live">● Conectando...</span></small></div></div>

<div class="card"><h3 style="margin:0 0 10px 0">📷 Escanear Entrada / Salida</h3><button class="btn btn-blue" onclick="startScan()">INICIAR ESCÁNER QR</button><div id="reader" style="margin-top:10px"></div></div>

<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">🚗 Autos Dentro: <span id="count" style="color:#16a34a">0</span> / 39</h3><button onclick="exportCSV()" style="background:#f1f5f9;border:1px solid #e2e8f0;padding:6px 12px;border-radius:8px;font-weight:700;font-size:12px">Exportar</button></div><div id="inside" style="margin-top:10px"></div></div>

<div class="card"><h3 style="margin:0 0 10px 0">🔍 Buscar Dueño</h3><input id="search" placeholder="Busca por placa JUC4688 o nombre" oninput="search()"><div id="searchRes"></div></div>

<div class="card"><h3 style="margin:0 0 10px 0">➕ Registrar Nuevo Auto</h3>
<input id="id" placeholder="ID Ej: CC-040"><input id="nombre" placeholder="Nombre completo"><input id="placa" placeholder="Placa"><input id="modelo" placeholder="Modelo"><input id="color" placeholder="Color">
<button class="btn btn-green" onclick="genPass()">✅ REGISTRAR Y GENERAR QR</button>
<div id="qrBox"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBZXQ9TuS4fnm-n5yIv2SsQmKyX_PVP75s",
  authDomain: "ascender-estacionamiento.firebaseapp.com",
  databaseURL: "https://ascender-estacionamiento-default-rtdb.firebaseio.com",
  projectId: "ascender-estacionamiento",
  storageBucket: "ascender-estacionamiento.firebasestorage.app",
  messagingSenderId: "60545755030",
  appId: "1:60545755030:web:8577f6f53ac06311f09fb7"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const autosRef = ref(db,'autos'); const regsRef = ref(db,'regs');
let autosBase=[
{"id":"CC-001","nombre":"CELESTE NAJAR","placa":"JUC4688","modelo":"Cruze Cruze","color":"Rojo"},
{"id":"CC-002","nombre":"GERARDO COMPARAN","placa":"LCL359A","modelo":"Chevrolet Truck 2026","color":"Gris Tiburón"},
{"id":"CC-003","nombre":"SILVIA SANDOVAL","placa":"HVM474A","modelo":"Nissan Versa 2024","color":"Blanco"},
{"id":"CC-004","nombre":"ESTHELA LARIOS","placa":"JFZ-270A","modelo":"Hyundai Creta","color":"Sin Datos"},
{"id":"CC-005","nombre":"GERARDO ELIEZAR CRUZ","placa":"JTC4841","modelo":"Chevrolet Grove 2022","color":"Tinto"},
{"id":"CC-006","nombre":"GABRIEL CAMARENA","placa":"KF6114A","modelo":"Nissan Frontier NP300","color":"Naranja"},
{"id":"CC-007","nombre":"RUBEN KUAN","placa":"KXMF65A","modelo":"Nissan Tiida","color":"Plata"},
{"id":"CC-008","nombre":"EFRAIN CHAVARRIA","placa":"KJX5554","modelo":"Kia Rio","color":"Gris"},
{"id":"CC-009","nombre":"CHAVARRIA AVILA","placa":"JAL76661","modelo":"Mitsubishi L200","color":"Blanca"},
{"id":"CC-010","nombre":"ISRAEL DE LA ROSA","placa":"JSP3379","modelo":"Hyundai Gran I-10","color":"Rojo"},
{"id":"CC-011","nombre":"GLORIA ACEVES","placa":"SEV318A","modelo":"Nissan Versa 2016","color":"Negro"},
{"id":"CC-012","nombre":"JESUS CABRERA","placa":"HYG090B","modelo":"Hyundai Gran I-10 2022","color":"Plata"},
{"id":"CC-013","nombre":"ANGEL ARAUJO","placa":"KXL346A","modelo":"Hyundai Hiunday","color":"Blanco"},
{"id":"CC-014","nombre":"GAEL SANCHEZ","placa":"72N254","modelo":"Toyota Toyota","color":"Blanco"},
{"id":"CC-015","nombre":"OSCAR J. PONCE","placa":"KCK255A","modelo":"Toyota Toyota","color":"Bronce"},
{"id":"CC-016","nombre":"SUSANA ESPINOZA","placa":"RRW078C","modelo":"Nissan Kicks","color":"Gris"},
{"id":"CC-017","nombre":"GILBERTO AGUILAR","placa":"SSH485B","modelo":"Chevrolet Tracker","color":"Blanca"},
{"id":"CC-018","nombre":"MIRNA MORA","placa":"JSS4458","modelo":"Chevrolet Aveo","color":"Gris"},
{"id":"CC-019","nombre":"OSCAR DE LA TORRE","placa":"54N847","modelo":"Geely Geely","color":"Gris"},
{"id":"CC-020","nombre":"JOSIAS MORA","placa":"JTR9713","modelo":"Chevrolet Aveo","color":"Ocre"},
{"id":"CC-021","nombre":"JOEL ORTEGA M","placa":"JRX1614","modelo":"Hyundai Hyundai","color":"Azul marino"},
{"id":"CC-022","nombre":"JOSE ZEPEDA","placa":"JX44994","modelo":"Chevrolet Tornado","color":"Blanca"},
{"id":"CC-023","nombre":"EMMA CRUZ","placa":"XXXYYZ","modelo":"Chevrolet Optra","color":"Blanco"},
{"id":"CC-024","nombre":"SILVIA LUPERCIO","placa":"JPU668A","modelo":"Dodge Caravan","color":"Blanca"},
{"id":"CC-025","nombre":"JORGE AGUILAR","placa":"LFM553A","modelo":"Audi y Creta 2020 y 2026","color":"Gris y Negro"},
{"id":"CC-026","nombre":"JORGE AGUILAR","placa":"JCM878A","modelo":"Hiunday Creta","color":"Negro"},
{"id":"CC-027","nombre":"REBECA LOPEZ","placa":"JSL9644","modelo":"Mitsubishi Mirage","color":"Rojo"},
{"id":"CC-028","nombre":"HECTOR PRADO","placa":"XXXYZZ","modelo":"Volkswagen Gol","color":"Blanco"},
{"id":"CC-029","nombre":"MARIO DEL RIO","placa":"JGB230A","modelo":"Chevrolet Beat","color":"Rojo"},
{"id":"CC-030","nombre":"BETTY MUNOZ","placa":"JZF1614","modelo":"Nissan Pathfinder","color":"Rojo"},
{"id":"CC-031","nombre":"JULIO PEREZ","placa":"JSX0034","modelo":"Honda Pilot","color":"Blanco"},
{"id":"CC-032","nombre":"MOISES RAMIREZ","placa":"XXXYYY","modelo":"Ram Adventure","color":"Roja"},
{"id":"CC-033","nombre":"BRENDA YANEZ","placa":"Y85NP2","modelo":"Nissan Versa","color":"Plata"},
{"id":"CC-034","nombre":"CESAR VAZQUEZ","placa":"LBL811A","modelo":"Nissan Sentra","color":"Blanco"},
{"id":"CC-035","nombre":"KARLA ROBLES","placa":"HWX209A","modelo":"Dodge Nitro","color":"Plata"},
{"id":"CC-036","nombre":"JOSE TORRES","placa":"RKW4335","modelo":"MG MG 5","color":"Blanco"},
{"id":"CC-037","nombre":"DAYDEE HERNANDEZ","placa":"49N516","modelo":"Toyota Camry","color":"Rojo quemado"},
{"id":"CC-038","nombre":"MAURICIO GONZALEZ","placa":"KXW962A","modelo":"Nissan Nissan","color":"Blanco"},
{"id":"CC-039","nombre":"ANGEL QUEZADA","placa":"KDM350A","modelo":"Mazda CX50","color":"Blanca"}
];
let autos=[], regs=[], regsRaw={};
onValue(autosRef, s=>{let v=s.val(); if(!v){let o={};autosBase.forEach(a=>o[a.id]=a);set(autosRef,o);} else {autos=Object.values(v); document.getElementById('estado').innerText='● En vivo'; render(); search();}});
onValue(regsRef, s=>{regsRaw=s.val()||{}; regs=Object.entries(regsRaw).map(([k,v])=>({...v,_key:k})); render();});

window.genPass=()=>{let id=document.getElementById('id').value.toUpperCase().trim();let pl=document.getElementById('placa').value.toUpperCase().trim();let no=document.getElementById('nombre').value.toUpperCase().trim(); if(!id||!pl) return alert('Falta ID y Placa'); let c={id,nombre:no,placa:pl,modelo:document.getElementById('modelo').value,color:document.getElementById('color').value}; set(ref(db,'autos/'+id),c); mostrarQR(c.id+'|'+c.nombre+'|'+c.placa,true);}
window.mostrarQR=(txt,nu)=>{let box=document.getElementById('qrBox'); box.style.display='block'; let p=txt.split('|'); let url='https://api.qrserver.com/v1/create-qr-code/?size=400x400&data='+encodeURIComponent(txt); box.innerHTML=`<img src="${url}" style="width:200px;height:200px;margin:auto"><div style="margin-top:10px"><b style="font-size:18px">${p[1]}</b><br><span style="color:#2563eb;font-weight:800">${p[2]}</span><br><small>${nu?'✅ GENERADO':'🔄 RECUPERADO'} - ${p[0]}</small><br><br><button onclick="window.open('${url}')" class="btn btn-dark" style="width:auto;padding:8px 16px">🖨️ DESCARGAR / IMPRIMIR QR</button></div>`; box.scrollIntoView({behavior:'smooth'});}
let qr; window.startScan=()=>{qr=new Html5Qrcode('reader'); qr.start({facingMode:'environment'},{fps:10,qrbox:250},t=>{window.registrar(t);qr.stop();document.getElementById('reader').innerHTML='';},()=>{});}
window.registrar=(code)=>{let id=code.split('|')[0];let pl=code.split('|')[2]||code; let a=autos.find(x=>x.id==id||x.placa==pl); if(!a) return alert('No encontrado '+code); let k=Object.keys(regsRaw).find(k=>regsRaw[k].id==a.id&&!regsRaw[k].salida); if(k){update(ref(db,'regs/'+k),{salida:new Date().toLocaleString('es-MX')}); alert('🔴 SALIDA: '+a.nombre);} else {push(regsRef,{id:a.id,nombre:a.nombre,placa:a.placa,entrada:new Date().toLocaleString('es-MX'),salida:null,ts:Date.now()}); alert('🟢 ENTRADA: '+a.nombre);}}
window.render=()=>{let d=regs.filter(r=>!r.salida); document.getElementById('count').innerText=d.length; document.getElementById('inside').innerHTML=d.map(r=>`<div class="list"><span><b>${r.placa}</b> - ${r.nombre}</span><span class="badge in">DENTRO</span></div>`).join('')||'<small style="color:#94a3b8">Nadie dentro</small>';}
window.search=()=>{let q=document.getElementById('search').value.toUpperCase(); let res=document.getElementById('searchRes'); if(!q){res.innerHTML='';return;} let f=autos.filter(a=>a.placa.includes(q)||a.nombre.includes(q)); res.innerHTML=f.map(a=>{let de=regs.find(x=>x.id==a.id&&!x.salida); return `<div class="list"><div><b>${a.nombre}</b><br>${a.placa} <small style="color:#64748b">${a.id}</small><br><button onclick="mostrarQR('${a.id}|${a.nombre}|${a.placa}')" style="margin-top:6px;padding:6px 10px;background:#0f172a;color:#fff;border:none;border-radius:6px;font-size:11px">🔳 Ver QR</button></div><div style="text-align:right"><span class="badge ${de?'in':'out'}">${de?'DENTRO':'FUERA'}</span><br><button onclick="registrar('${a.id}|${a.nombre}|${a.placa}')" class="btn ${de?'btn-red':'btn-green'}" style="padding:6px 10px;font-size:11px;margin-top:6px;width:auto">${de?'Marcar Salida':'Marcar Entrada'}</button></div></div>`}).join('')||'No encontrado';}
window.exportCSV=()=>{let csv='ID,Nombre,Placa,Entrada,Salida\n'+regs.map(r=>`${r.id},${r.nombre},${r.placa},${r.entrada},${r.salida||''}`).join('\n'); let b=new Blob([csv],{type:'text/csv'}); let u=URL.createObjectURL(b); let a=document.createElement('a'); a.href=u; a.download='Ascender.csv'; a.click();}
</script>
</body>
</html>
